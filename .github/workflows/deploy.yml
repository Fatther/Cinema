name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Run tests
        run: ./gradlew test

      - name: Build backend Docker image
        run: docker build -f Dockerfile -t cinema-backend .

      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile -t cinema-frontend ./frontend

  healthcheck:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Wait for Railway deploy
        run: sleep 60

      - name: Health check
        run: curl --fail https://cinema-production-8a93.up.railway.app/actuator/health