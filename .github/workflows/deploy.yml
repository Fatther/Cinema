name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Сборка
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 2. Тесты
      - name: Run tests
        run: ./gradlew test

      # 3. Сборка Docker образа
      - name: Build Docker image
        run: docker build -t cinema-app .

      # 4. Деплой на Railway
      - name: Deploy to Railway
        run: |
          npm install -g @railway/cli
          railway up --service cinema-app
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # 5. Healthcheck
      - name: Health check
        run: |
          sleep 30
          curl --fail https://cinema-production-8a93.up.railway.app/actuator/health